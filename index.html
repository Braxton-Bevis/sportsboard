<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sportsboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ---------------------------------------------------------------
   Sportsboard — broadcast delay rack, slideshow build
   Palette: slate signal-room blue, amber tally, cyan timecode.
   Team colours come from the feed, so the accent varies by fixture.
   Motion is transform/opacity only — the Nano's GPU thanks you.
----------------------------------------------------------------*/
:root{
  --ink:#0A0E16;
  --panel:#141C29;
  --panel-lift:#1A2433;
  --line:#243244;
  --text:#E9EFF6;
  --dim:#7A8CA0;
  --faint:#4E5F73;
  --tally:#F5A524;
  --tape:#5AC8DA;
  --accent:#5AC8DA;
  --win:#3FBF7F;
  --gutter:clamp(16px,2vw,34px);
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--ink);
  color:var(--text);
  font-family:"Barlow","Helvetica Neue",sans-serif;
  font-size:16px;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}
body.kiosk{cursor:none}

/* ---------- header rack ---------- */
.rack{
  flex:0 0 auto;
  display:flex;
  align-items:center;
  gap:var(--gutter);
  padding:12px var(--gutter);
  border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,#111925,#0C121C);
}
.rack__id{min-width:340px}
.rack__eyebrow{
  display:block;
  font-family:"IBM Plex Mono",monospace;
  font-size:11px;
  letter-spacing:.34em;
  color:var(--faint);
  text-transform:uppercase;
  margin-bottom:2px;
}
/* the day is the thing you read from across the room — give it room */
.rack__date{
  font-family:"Barlow Condensed","Arial Narrow",sans-serif;
  font-weight:700;
  font-size:clamp(38px,4.2vw,68px);
  letter-spacing:.015em;
  line-height:.95;
  text-transform:uppercase;
  white-space:nowrap;
}
.tape{flex:1 1 auto;display:flex;align-items:center;gap:14px;min-width:0}
.tape__label{
  font-family:"IBM Plex Mono",monospace;
  font-size:11px;
  letter-spacing:.24em;
  color:var(--dim);
  white-space:nowrap;
}
.tape__offset{
  font-family:"IBM Plex Mono",monospace;
  font-size:clamp(20px,2vw,30px);
  font-weight:600;
  color:var(--tape);
  font-variant-numeric:tabular-nums;
}
.rack__right{display:flex;align-items:center;gap:18px;margin-left:auto}
.rack__clock{
  font-family:"IBM Plex Mono",monospace;
  font-size:clamp(20px,2vw,30px);
  font-variant-numeric:tabular-nums;
  color:var(--text);
}
.rack__signal{
  font-family:"IBM Plex Mono",monospace;
  font-size:11px;
  letter-spacing:.18em;
  text-transform:uppercase;
  color:var(--dim);
  border:1px solid var(--line);
  border-radius:3px;
  padding:5px 10px;
  white-space:nowrap;
}
.rack__signal.is-warn{color:var(--tally);border-color:#4A3A1A}

/* ---------- warming banner ---------- */
.warming{
  display:none;
  flex:0 0 auto;
  align-items:center;
  gap:12px;
  padding:9px var(--gutter);
  background:#2A2010;
  border-bottom:1px solid #4A3A1A;
  color:var(--tally);
  font-family:"IBM Plex Mono",monospace;
  font-size:13px;
  letter-spacing:.06em;
}
.warming.is-on{display:flex}
.warming__dot{
  width:9px;height:9px;border-radius:50%;
  background:var(--tally);
  animation:pulse 1.6s ease-in-out infinite;
}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

/* ---------- stage ---------- */
.stage{
  flex:1 1 auto;
  position:relative;
  overflow:hidden;
  padding:var(--gutter);
}
.slide{
  position:absolute;
  inset:var(--gutter);
  display:flex;
  flex-direction:column;
  animation:slidein .42s cubic-bezier(.22,.61,.36,1) both;
}
@keyframes slidein{
  from{opacity:0;transform:translate3d(34px,0,0)}
  to{opacity:1;transform:translate3d(0,0,0)}
}
@media (prefers-reduced-motion:reduce){
  .slide{animation:none}
}

.slide__head{
  flex:0 0 auto;
  display:flex;
  align-items:baseline;
  gap:16px;
  margin-bottom:14px;
  padding-bottom:10px;
  border-bottom:2px solid var(--line);
}
.slide__kicker{
  font-family:"Barlow Condensed","Arial Narrow",sans-serif;
  font-weight:700;
  font-size:clamp(28px,3.1vw,50px);
  letter-spacing:.03em;
  text-transform:uppercase;
  line-height:1;
}
.slide__kicker.is-live{color:var(--tally)}
.slide__sub{
  font-family:"IBM Plex Mono",monospace;
  font-size:12px;
  letter-spacing:.2em;
  text-transform:uppercase;
  color:var(--dim);
}
.slide__page{
  margin-left:auto;
  font-family:"IBM Plex Mono",monospace;
  font-size:12px;
  letter-spacing:.18em;
  color:var(--faint);
}
.slide__body{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}

/* ---------- game cards ---------- */
.grid{
  flex:1 1 auto;
  display:grid;
  gap:14px;
  align-content:start;
}
.grid.cols-2{grid-template-columns:repeat(2,1fr)}
.grid.cols-3{grid-template-columns:repeat(3,1fr)}

/* ---------- scale to how many are actually on the slide ----------
   The deck caps a slide at four fixtures, but most slides carry fewer.
   Rather than leave a lone game marooned in a corner, the grid reflows
   and the type steps up as the count drops. --cs is a scale multiplier
   the card rules below hang off, so one knob drives the whole card. */
.slide[data-count="1"] .grid{--cs:1.75;grid-template-columns:1fr;align-content:center}
.slide[data-count="2"] .grid{--cs:1.35;grid-template-columns:1fr;align-content:center}
.slide[data-count="3"] .grid{--cs:1.12;grid-template-columns:repeat(2,1fr)}
.slide[data-count="4"] .grid{--cs:1;grid-template-columns:repeat(2,1fr)}
/* a lone card shouldn't stretch the full width of a 16:9 panel */
.slide[data-count="1"] .grid > *{max-width:78%;margin:0 auto;width:100%}
.slide[data-count="2"] .grid > *{max-width:92%;margin:0 auto;width:100%}

/* staggered entrance — each item leans in a beat after the one before it.
   transform/opacity only, so the Nano stays on the compositor. */
.grid > *,.odds__row,.week__row,.week__day{
  animation:pop .46s cubic-bezier(.22,.61,.36,1) both;
  animation-delay:calc(var(--i,0) * 65ms);
}
@keyframes pop{
  from{opacity:0;transform:translate3d(0,18px,0)}
  to{opacity:1;transform:translate3d(0,0,0)}
}

/* a kickoff-time divider inside the grid */
.slot{
  grid-column:1/-1;
  display:flex;
  align-items:center;
  gap:16px;
  margin-top:6px;
}
.slot__time{
  font-family:"Barlow Condensed","Arial Narrow",sans-serif;
  font-weight:700;
  font-size:clamp(24px,2.2vw,38px);
  letter-spacing:.05em;
  color:var(--tally);
  line-height:1;
  white-space:nowrap;
}
.slot__count{
  font-family:"IBM Plex Mono",monospace;
  font-size:11px;
  letter-spacing:.2em;
  text-transform:uppercase;
  color:var(--faint);
  white-space:nowrap;
}
.slot__rule{flex:1 1 auto;height:1px;background:var(--line)}

@media (prefers-reduced-motion:reduce){
  .grid > *,.odds__row,.week__row,.week__day{animation:none}
}

.card{
  position:relative;
  background:var(--panel);
  border:1px solid var(--line);
  border-left:5px solid var(--accent);
  border-radius:6px;
  padding:calc(14px * var(--cs,1)) calc(16px * var(--cs,1));
  display:flex;
  flex-direction:column;
  gap:calc(10px * var(--cs,1));
  min-height:0;
}
.card__top{
  display:flex;
  align-items:center;
  gap:10px;
  font-family:"IBM Plex Mono",monospace;
  font-size:11px;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--dim);
}
.card__league{color:var(--accent);font-weight:600}
.card__status{margin-left:auto;color:var(--text);white-space:nowrap}
.card__status.is-live{color:var(--tally);font-weight:600}

.row{display:flex;align-items:center;gap:calc(11px * var(--cs,1))}
.row__logo{
  width:calc(34px * var(--cs,1));height:calc(34px * var(--cs,1));flex:0 0 auto;
  object-fit:contain;
}
.row__rank{
  font-family:"IBM Plex Mono",monospace;
  font-size:12px;color:var(--tally);flex:0 0 auto;
}
.row__name{
  font-family:"Barlow Condensed","Arial Narrow",sans-serif;
  font-weight:600;
  font-size:calc(clamp(19px,1.65vw,27px) * var(--cs,1));
  line-height:1.08;
  letter-spacing:.01em;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  flex:1 1 auto;
  min-width:0;
}
.row__rec{
  font-family:"IBM Plex Mono",monospace;
  font-size:11px;color:var(--faint);flex:0 0 auto;
}
.row__score{
  font-family:"Barlow Condensed","Arial Narrow",sans-serif;
  font-weight:700;
  font-size:calc(clamp(28px,2.9vw,46px) * var(--cs,1));
  line-height:1;
  font-variant-numeric:tabular-nums;
  flex:0 0 auto;
  min-width:1.6em;
  text-align:right;
}
.row.is-loser .row__name,.row.is-loser .row__score{color:var(--faint)}
.row.is-winner .row__score{color:var(--win)}
.card__meta{
  font-family:"IBM Plex Mono",monospace;
  font-size:11px;
  color:var(--faint);
  letter-spacing:.08em;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.card__line{
  display:flex;gap:14px;flex-wrap:wrap;
  font-family:"IBM Plex Mono",monospace;
  font-size:12px;
  color:var(--dim);
  letter-spacing:.06em;
  border-top:1px solid var(--line);
  padding-top:8px;
}
.card__line b{color:var(--tally);font-weight:600}
.held{color:var(--tally);letter-spacing:.2em}

/* ---------- odds table ---------- */
.odds{
  flex:1 1 auto;
  display:flex;
  flex-direction:column;
  gap:8px;
  align-content:start;
}
.odds__head,.odds__row{
  display:grid;
  grid-template-columns:120px 1fr 130px 170px 110px;
  gap:14px;
  align-items:center;
  padding:0 14px;
}
.odds__head{
  font-family:"IBM Plex Mono",monospace;
  font-size:11px;
  letter-spacing:.2em;
  text-transform:uppercase;
  color:var(--faint);
  padding-bottom:6px;
  border-bottom:1px solid var(--line);
}
.odds__row{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:5px;
  padding:11px 14px;
}
.odds__when{
  font-family:"IBM Plex Mono",monospace;
  font-size:12px;
  color:var(--dim);
  letter-spacing:.04em;
}
.odds__match{
  display:flex;align-items:center;gap:9px;
  font-family:"Barlow Condensed","Arial Narrow",sans-serif;
  font-weight:600;
  font-size:clamp(17px,1.45vw,24px);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.odds__match img{width:26px;height:26px;object-fit:contain;flex:0 0 auto}
.odds__at{color:var(--faint);font-family:"IBM Plex Mono",monospace;font-size:12px}
.odds__num{
  font-family:"IBM Plex Mono",monospace;
  font-size:clamp(14px,1.15vw,18px);
  font-variant-numeric:tabular-nums;
  letter-spacing:.02em;
}
.odds__num.is-key{color:var(--tally);font-weight:600}
.odds__ml{color:var(--text)}
.odds__ml .fav{color:var(--tally);font-weight:600}
.odds__none{color:var(--faint)}

/* ---------- betting lines, sized up ----------
   Only two lines to a slide now, so they get the whole panel. The rows
   centre vertically and every figure grows — the numbers are the point
   of this slide, so they should read from across the room. */
.slide[data-kind="odds"] .odds{justify-content:center;gap:18px}
.slide[data-kind="odds"] .odds__row{
  padding:22px 20px;
  border-radius:8px;
  border-left:5px solid var(--accent);
}
.slide[data-kind="odds"] .odds__head{font-size:13px;padding-bottom:10px}
.slide[data-kind="odds"] .odds__when{font-size:16px}
.slide[data-kind="odds"] .odds__match{font-size:clamp(24px,2.1vw,36px);gap:12px}
.slide[data-kind="odds"] .odds__match img{width:38px;height:38px}
.slide[data-kind="odds"] .odds__at{font-size:16px}
.slide[data-kind="odds"] .odds__num{font-size:clamp(22px,1.9vw,32px)}

/* a single line gets even more room */
.slide[data-kind="odds"][data-count="1"] .odds__row{padding:30px 24px}
.slide[data-kind="odds"][data-count="1"] .odds__match{font-size:clamp(28px,2.5vw,44px)}
.slide[data-kind="odds"][data-count="1"] .odds__match img{width:46px;height:46px}
.slide[data-kind="odds"][data-count="1"] .odds__num{font-size:clamp(26px,2.3vw,40px)}

/* ---------- Alabama feature slide ----------
   One game, whole panel. Everything is oversized on purpose: this is the
   slide you read from the far side of the room. */
.bama{
  flex:1 1 auto;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:22px;
  text-align:center;
}
.bama__vs{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:clamp(24px,4vw,70px);
  width:100%;
}
.bama__side{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0}
.bama__logo{width:clamp(70px,7vw,120px);height:clamp(70px,7vw,120px);object-fit:contain}
.bama__team{
  font-family:"Barlow Condensed","Arial Narrow",sans-serif;
  font-weight:700;
  font-size:clamp(30px,3vw,52px);
  line-height:1.02;
  letter-spacing:.01em;
}
.bama__rec{font-family:"IBM Plex Mono",monospace;font-size:14px;color:var(--faint)}
.bama__score{
  font-family:"Barlow Condensed","Arial Narrow",sans-serif;
  font-weight:700;
  font-size:clamp(46px,5vw,86px);
  line-height:1;
  color:var(--win);
  font-variant-numeric:tabular-nums;
}
.bama__at{
  font-family:"IBM Plex Mono",monospace;
  font-size:clamp(18px,1.6vw,26px);
  color:var(--faint);
}
.bama__when{
  font-family:"Barlow Condensed","Arial Narrow",sans-serif;
  font-weight:700;
  font-size:clamp(26px,2.6vw,44px);
  letter-spacing:.03em;
  color:var(--tally);
}
.bama__when.is-live{color:var(--win)}
.bama__meta{
  font-family:"IBM Plex Mono",monospace;
  font-size:clamp(12px,1.05vw,16px);
  letter-spacing:.12em;
  text-transform:uppercase;
  color:var(--dim);
}
.bama__odds{
  display:flex;
  gap:clamp(14px,2vw,34px);
  flex-wrap:wrap;
  justify-content:center;
  margin-top:4px;
}
.bama__cell{
  background:var(--panel);
  border:1px solid var(--line);
  border-left:4px solid var(--accent);
  border-radius:7px;
  padding:12px 20px;
  min-width:130px;
}
.bama__label{
  font-family:"IBM Plex Mono",monospace;
  font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint);
  margin-bottom:5px;
}
.bama__val{
  font-family:"Barlow Condensed","Arial Narrow",sans-serif;
  font-weight:700;
  font-size:clamp(24px,2.2vw,38px);
  line-height:1;
  color:var(--tally);
  font-variant-numeric:tabular-nums;
}

/* keep game grids vertically centred so a short slide doesn't leave a
   dead band across the bottom of the panel */
.slide[data-kind="today"] .grid,
.slide[data-kind="live"] .grid,
.slide[data-kind="final"] .grid{align-content:center}

/* ---------- week list ---------- */
.week{flex:1 1 auto;display:flex;flex-direction:column;gap:7px}
.week__day{
  font-family:"Barlow Condensed","Arial Narrow",sans-serif;
  font-weight:700;
  font-size:clamp(26px,2.4vw,40px);
  letter-spacing:.045em;
  line-height:1.05;
  text-transform:uppercase;
  color:var(--accent);
  margin-top:12px;
  padding-bottom:5px;
  border-bottom:1px solid var(--line);
}
.week__day:first-child{margin-top:0}
.week__row{
  display:grid;
  grid-template-columns:110px 1fr 150px 150px;
  gap:14px;
  align-items:center;
  padding:8px 12px;
  background:var(--panel);
  border-radius:4px;
}
.week__time{
  font-family:"IBM Plex Mono",monospace;
  font-size:13px;color:var(--tape);
  font-variant-numeric:tabular-nums;
}
.week__who{
  display:flex;
  align-items:center;
  gap:7px;
  font-family:"Barlow Condensed","Arial Narrow",sans-serif;
  font-weight:600;
  font-size:clamp(17px,1.4vw,23px);
  white-space:nowrap;overflow:hidden;
  min-width:0;
}
.week__who img{width:22px;height:22px;object-fit:contain;flex:0 0 auto}
.week__who span{overflow:hidden;text-overflow:ellipsis}
.week__v{color:var(--faint);font-family:"IBM Plex Mono",monospace;font-size:11px;flex:0 0 auto}
.week__lg,.week__tv{
  font-family:"IBM Plex Mono",monospace;
  font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.week__lg{color:var(--dim)}

/* ---------- empty ---------- */
.empty{
  flex:1 1 auto;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:12px;text-align:center;
}
.empty__big{
  font-family:"Barlow Condensed","Arial Narrow",sans-serif;
  font-weight:700;font-size:clamp(34px,4vw,64px);
  letter-spacing:.04em;text-transform:uppercase;color:var(--faint);
}
.empty__sub{font-size:clamp(14px,1.2vw,19px);color:var(--dim);max-width:60ch}

/* ---------- bottom rail ---------- */
.rail{
  flex:0 0 auto;
  display:flex;align-items:center;gap:16px;
  padding:9px var(--gutter);
  border-top:1px solid var(--line);
  background:#0C121C;
}
.rail__dots{display:flex;gap:7px;flex-wrap:wrap;flex:1 1 auto;min-width:0}
.dot{
  width:9px;height:9px;border-radius:50%;
  background:var(--line);
  flex:0 0 auto;
  transition:background .3s,transform .3s;
}
.dot.is-on{background:var(--accent);transform:scale(1.34)}
.dot.is-live{background:var(--tally)}
.rail__meta{
  font-family:"IBM Plex Mono",monospace;
  font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);
  white-space:nowrap;
}
.bar{
  position:absolute;left:0;bottom:0;height:3px;width:100%;
  background:var(--accent);
  transform-origin:0 50%;
  transform:scaleX(0);
}
.rail{position:relative}
.rail.is-paused .bar{background:var(--faint)}

/* ---------- 900p / short panels tighten up ---------- */
@media (max-height:940px){
  :root{--gutter:clamp(12px,1.5vw,22px)}
  .rack{padding:9px var(--gutter)}
  .slide__head{margin-bottom:10px;padding-bottom:7px}
  .grid{gap:10px}
  .card{padding:11px 13px;gap:7px}
  .row__logo{width:29px;height:29px}
  .odds__row{padding:8px 13px}
  .odds{gap:6px}
  .week__row{padding:6px 11px}
  .week{gap:5px}
}

/* ---------- 300% browser scale: ~640x360 CSS px on a 1080p panel ---------- */
@media (max-height:520px){
  :root{--gutter:10px}
  .rack{padding:6px var(--gutter);gap:14px}
  .rack__id{min-width:0}
  .rack__date{font-size:26px}
  .tape__label{display:none}
  .rack__clock{font-size:17px}
  .rack__signal{padding:3px 7px;font-size:9px}
  .tape__offset{font-size:17px}
  .slide__kicker{font-size:24px}
  .slide__sub{font-size:10px;letter-spacing:.12em}
  .slide__head{margin-bottom:7px;padding-bottom:5px;gap:10px}
  .grid{gap:8px}
  .grid.cols-2,.grid.cols-3{grid-template-columns:repeat(2,1fr)}
  .card{padding:8px 10px;gap:5px;border-left-width:4px;border-radius:4px}
  .card__top{font-size:9px;gap:6px}
  .row{gap:7px}
  .row__logo{width:21px;height:21px}
  .row__name{font-size:15px}
  .row__score{font-size:21px}
  .row__rec{display:none}
  .card__line{font-size:10px;gap:9px;padding-top:5px}
  .card__meta{font-size:9px}
  .slot__time{font-size:19px}
  .slot__count{font-size:9px}
  .odds__head,.odds__row{grid-template-columns:64px 1fr 84px 110px 52px;gap:8px;padding:0 8px}
  .odds__row{padding:6px 8px}
  .odds__when{font-size:10px}
  .odds__match{font-size:14px;gap:5px}
  .odds__match img{width:18px;height:18px}
  .odds__num{font-size:12px}
  .week__day{font-size:19px;margin-top:6px;padding-bottom:3px}
  .week__row{grid-template-columns:64px 1fr 92px;gap:8px;padding:4px 8px}
  .week__tv{display:none}
  .week__time{font-size:11px}
  .week__who{font-size:14px;gap:5px}
  .week__who img{width:17px;height:17px}
  .week__lg{font-size:9px}
  .week{gap:4px}
  .rail{padding:5px var(--gutter)}
  .dot{width:6px;height:6px}
  .rail__meta{font-size:9px;letter-spacing:.08em}
  .warming{padding:5px var(--gutter);font-size:10px}
}
</style>
</head>
<body class="kiosk">

<header class="rack">
  <div class="rack__id">
    <span class="rack__eyebrow">Sportsboard</span>
    <span class="rack__date" id="today">—</span>
  </div>
  <div class="tape">
    <span class="tape__label">Behind live</span>
    <span class="tape__offset" id="offset">—:—</span>
  </div>
  <div class="rack__right">
    <span class="rack__clock" id="clock">--:--:--</span>
    <span class="rack__signal" id="signal">Connecting</span>
  </div>
</header>

<div class="warming" id="warming">
  <span class="warming__dot"></span>
  <span id="warmingText">Filling the delay buffer.</span>
</div>

<main class="stage" id="stage"></main>

<footer class="rail" id="rail">
  <div class="rail__dots" id="dots"></div>
  <span class="rail__meta" id="railMeta"></span>
  <div class="bar" id="bar"></div>
</footer>

<script>
(function () {
  "use strict";

  var REFRESH_MS = 15000;    // how often we re-pull /api/board
  var TICK_MS    = 100;      // slideshow clock granularity

  // How long each kind of slide holds the screen.
  var HOLD = {
    live:  16000,
    today: 14000,
    final: 13000,
    odds:  15000,
    week:  15000,
    empty: 12000
  };

  // Per-page capacity, and a ceiling on pages so one huge NFL Sunday
  // can't stretch the loop to ten minutes. Anything dropped is counted
  // and shown in the slide header rather than silently vanishing.
  // Four fixtures a slide is the readable maximum at 300% scale; when a
  // bucket has more we add slides rather than shrink past legibility.
  var PER = { live: 4, today: 4, final: 4, odds: 2, week: 6 };
  var MAXPAGES = { live: 8, today: 10, final: 8, odds: 8, week: 12 };

  // A slide holding one fixture doesn't need as long on screen as a full
  // one. Odds slides in particular read in a glance when there's a single
  // line up.
  function holdFor(kind, n) {
    if (kind === "odds") return n <= 1 ? 5000 : 10000;
    if (n <= 1) return Math.max(6000, HOLD[kind] - 6000);
    if (n === 2) return Math.max(8000, HOLD[kind] - 3000);
    return HOLD[kind];
  }

  var deck = [];
  var index = 0;
  var elapsed = 0;
  var paused = false;
  var auto = true;
  var renderedId = null;
  var renderedSig = null;
  var lastData = null;

  /* ---------- small helpers ---------- */

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined && text !== null) n.textContent = text;
    return n;
  }

  function mmss(sec) {
    sec = Math.max(0, Math.round(sec));
    var m = Math.floor(sec / 60), s = sec % 60;
    return m + ":" + (s < 10 ? "0" : "") + s;
  }

  function timeOf(epoch) {
    if (!epoch) return "TBD";
    return new Date(epoch * 1000)
      .toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  }

  function dayOf(epoch) {
    if (!epoch) return "";
    return new Date(epoch * 1000)
      .toLocaleDateString([], { weekday: "short", month: "short", day: "numeric" });
  }

  function longDay(epoch) {
    if (!epoch) return "Date TBD";
    var d = new Date(epoch * 1000);
    var now = new Date();
    var t = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    var g = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    var days = Math.round((g - t) / 86400000);
    var label = d.toLocaleDateString([], { weekday: "long", month: "short", day: "numeric" });
    if (days === 0) return "Today — " + label;
    if (days === 1) return "Tomorrow — " + label;
    return label;
  }

  function logo(side) {
    if (!side.logo) return null;
    var img = document.createElement("img");
    img.src = side.logo;
    img.alt = "";
    img.loading = "lazy";
    img.onerror = function () { img.style.visibility = "hidden"; };
    return img;
  }

  // American moneyline -> implied win probability.
  //   -270  ->  270/(270+100)  = 73.0%
  //   +650  ->  100/(650+100)  = 13.3%
  // Note these include the book's margin, so the two sides of a game sum to
  // a bit over 100% - that overround is the vig, not an error.
  function impliedPct(ml) {
    if (ml === null || ml === undefined || ml === "") return null;
    var n = parseInt(String(ml).replace(/[^0-9+\-]/g, ""), 10);
    if (isNaN(n) || n === 0) return null;
    var p = n < 0 ? (-n) / ((-n) + 100) : 100 / (n + 100);
    return (Math.round(p * 1000) / 10).toFixed(1) + "%";
  }

  function chunk(list, size, maxPages) {
    var pages = [];
    for (var i = 0; i < list.length; i += size) pages.push(list.slice(i, i + size));
    var dropped = 0;
    if (maxPages && pages.length > maxPages) {
      var kept = maxPages * size;
      dropped = list.length - kept;
      pages = pages.slice(0, maxPages);
    }
    return { pages: pages, dropped: dropped };
  }

  /* ---------- card builders ---------- */

  function teamRow(side, other, state) {
    var row = el("div", "row");
    var mine = side.score === null || side.score === undefined ? null : parseInt(side.score, 10);
    var theirs = other.score === null || other.score === undefined ? null : parseInt(other.score, 10);

    if (state === "post" && mine !== null && theirs !== null) {
      if (mine > theirs) row.classList.add("is-winner");
      else if (mine < theirs) row.classList.add("is-loser");
    }

    var mark = logo(side);
    if (mark) { mark.className = "row__logo"; row.appendChild(mark); }
    if (side.rank) row.appendChild(el("span", "row__rank", "#" + side.rank));

    row.appendChild(el("span", "row__name", side.name || "TBD"));
    if (side.record && state === "pre") row.appendChild(el("span", "row__rec", side.record));

    if (state !== "pre") {
      var txt = (side.score === null || side.score === undefined) ? "–" : side.score;
      if (side.shootout) txt = txt + " (" + side.shootout + ")";
      row.appendChild(el("span", "row__score", txt));
    }
    return row;
  }

  function oddsBits(game) {
    // Compact line summary for the face of a card.
    var o = game.odds;
    if (!o) return null;
    var wrap = el("div", "card__line");
    if (o.details) {
      var s = el("span", null, "LINE ");
      s.appendChild(el("b", null, o.details));
      wrap.appendChild(s);
    }
    if (o.overUnder !== null && o.overUnder !== undefined) {
      var t = el("span", null, "O/U ");
      t.appendChild(el("b", null, String(o.overUnder)));
      wrap.appendChild(t);
    }
    if (o.awayML && o.homeML) {
      wrap.appendChild(el("span", null, "ML " + o.awayML + " / " + o.homeML));
    }
    return wrap.childNodes.length ? wrap : null;
  }

  function buildCard(game) {
    var card = el("article", "card");
    if (game.home.color) card.style.borderLeftColor = game.home.color;

    var top = el("div", "card__top");
    top.appendChild(el("span", "card__league", game.league));
    if (game.broadcast) top.appendChild(el("span", null, game.broadcast));

    var status = el("span", "card__status");
    if (game.redacted) {
      status.appendChild(el("span", "held", "HELD"));
    } else if (game.state === "in") {
      status.className = "card__status is-live";
      // ESPN's shortDetail usually embeds the clock already ("14:55 - 1st")
      var detail = game.detail || "LIVE";
      status.textContent = (game.clock && detail.indexOf(game.clock) === -1)
        ? game.clock + "  " + detail : detail;
    } else if (game.state === "post") {
      status.textContent = game.detail || "Final";
    } else {
      status.textContent = timeOf(game.start);
    }
    top.appendChild(status);
    card.appendChild(top);

    card.appendChild(teamRow(game.away, game.home, game.state));
    card.appendChild(teamRow(game.home, game.away, game.state));

    var line = oddsBits(game);
    if (line) {
      card.appendChild(line);
    } else if (game.venue) {
      card.appendChild(el("div", "card__meta", game.venue));
    }
    return card;
  }

  /* ---------- slide renderers ---------- */

  function gridSlide(games, cols, grouped) {
    var body = el("div", "slide__body");
    var grid = el("div", "grid cols-" + cols);
    var slot = null;
    var step = 0;

    games.forEach(function (g, i) {
      if (grouped) {
        var label = timeOf(g.start);
        if (label !== slot) {
          slot = label;
          // how many share this kickoff, counting only what's on this page
          var n = 0;
          for (var j = i; j < games.length; j++) {
            if (timeOf(games[j].start) !== label) break;
            n++;
          }
          var head = el("div", "slot");
          head.appendChild(el("span", "slot__time", label));
          head.appendChild(el("span", "slot__count", n + (n === 1 ? " game" : " games")));
          head.appendChild(el("span", "slot__rule"));
          head.style.setProperty("--i", step++);
          grid.appendChild(head);
        }
      }
      var card = buildCard(g);
      card.style.setProperty("--i", step++);
      grid.appendChild(card);
    });

    body.appendChild(grid);
    return body;
  }

  function oddsSlide(games) {
    var body = el("div", "slide__body");
    var table = el("div", "odds");

    var head = el("div", "odds__head");
    ["When", "Matchup", "Spread", "Win chance", "Total"].forEach(function (h) {
      head.appendChild(el("span", null, h));
    });
    table.appendChild(head);

    games.forEach(function (g, i) {
      var row = el("div", "odds__row");
      row.style.setProperty("--i", i + 1);
      var o = g.odds || {};

      var when = g.state === "in" ? "LIVE"
               : g.state === "post" ? "FINAL"
               : (g.today ? timeOf(g.start) : dayOf(g.start) + " " + timeOf(g.start));
      row.appendChild(el("span", "odds__when", when));

      var match = el("div", "odds__match");
      var a = logo(g.away); if (a) match.appendChild(a);
      match.appendChild(el("span", null, g.away.abbr || g.away.name));
      match.appendChild(el("span", "odds__at", "@"));
      var h = logo(g.home); if (h) match.appendChild(h);
      match.appendChild(el("span", null, g.home.abbr || g.home.name));
      row.appendChild(match);

      row.appendChild(el("span", "odds__num is-key", o.details || "—"));

      var ml = el("span", "odds__num odds__ml");
      if (o.awayML || o.homeML) {
        // shown as implied win probability rather than American odds
        var awaySpan = el("span", o.favorite && o.favorite === g.away.abbr ? "fav" : null,
                          impliedPct(o.awayML) || "—");
        var homeSpan = el("span", o.favorite && o.favorite === g.home.abbr ? "fav" : null,
                          impliedPct(o.homeML) || "—");
        ml.appendChild(awaySpan);
        ml.appendChild(el("span", null, "  /  "));
        ml.appendChild(homeSpan);
      } else {
        ml.className = "odds__num odds__none";
        ml.textContent = "—";
      }
      row.appendChild(ml);

      var ou = (o.overUnder === null || o.overUnder === undefined) ? "—" : String(o.overUnder);
      row.appendChild(el("span", "odds__num", ou));

      table.appendChild(row);
    });

    body.appendChild(table);
    return body;
  }

  // hideDayHeads: the per-day slides already carry the day in the kicker,
  // so repeating it inside the list is just noise.
  function weekSlide(games, hideDayHeads) {
    var body = el("div", "slide__body");
    var list = el("div", "week");
    var currentDay = null;
    var step = 0;

    games.forEach(function (g) {
      if (g.day !== currentDay) {
        currentDay = g.day;
        if (!hideDayHeads) {
          var head = el("div", "week__day", longDay(g.start));
          head.style.setProperty("--i", step++);
          list.appendChild(head);
        }
      }
      var row = el("div", "week__row");
      row.style.setProperty("--i", step++);
      row.appendChild(el("span", "week__time", timeOf(g.start)));

      var who = el("span", "week__who");
      var a = logo(g.away); if (a) who.appendChild(a);
      who.appendChild(el("span", null, g.away.name || "TBD"));
      who.appendChild(el("span", "week__v", "v"));
      var h = logo(g.home); if (h) who.appendChild(h);
      who.appendChild(el("span", null, g.home.name || "TBD"));
      row.appendChild(who);

      row.appendChild(el("span", "week__lg", g.league));
      row.appendChild(el("span", "week__tv", g.broadcast || ""));
      list.appendChild(row);
    });

    body.appendChild(list);
    return body;
  }

  /* ---------- Alabama feature slide ---------- */

  // Alabama FOOTBALL only, and it comes straight from the server, which
  // pulls the team's own schedule. The scoreboard feeds only look
  // days_ahead into the future, so out of season the next game isn't in
  // `games` at all - that's why this isn't just a filter over the slate.
  function findBama(data) {
    return data.bama || null;
  }

  function bamaSide(t, score, showScore) {
    var box = el("div", "bama__side");
    var lg = logo(t);
    if (lg) { lg.className = "bama__logo"; box.appendChild(lg); }
    box.appendChild(el("div", "bama__team", t.name || t.full || "TBD"));
    if (t.record) box.appendChild(el("div", "bama__rec", t.record));
    if (showScore) box.appendChild(el("div", "bama__score", score === null || score === undefined ? "—" : String(score)));
    return box;
  }

  function bamaSlide(g) {
    var body = el("div", "slide__body");
    var wrap = el("div", "bama");
    var showScore = g.state === "in" || g.state === "post";

    var vs = el("div", "bama__vs");
    vs.appendChild(bamaSide(g.away, g.away.score, showScore));
    vs.appendChild(el("div", "bama__at", showScore ? "" : "@"));
    vs.appendChild(bamaSide(g.home, g.home.score, showScore));
    wrap.appendChild(vs);

    // kickoff / status line
    var when = g.state === "in" ? (g.status || "LIVE")
             : g.state === "post" ? "FINAL"
             : (longDay(g.start) + " · " + timeOf(g.start));
    var whenEl = el("div", "bama__when" + (g.state === "in" ? " is-live" : ""), when);
    wrap.appendChild(whenEl);

    var meta = [];
    if (g.league) meta.push(g.league);
    if (g.broadcast) meta.push(g.broadcast);
    if (g.venue) meta.push(g.venue);
    if (meta.length) wrap.appendChild(el("div", "bama__meta", meta.join("  ·  ")));

    // betting block
    var o = g.odds;
    if (o) {
      var odds = el("div", "bama__odds");
      function cell(label, value) {
        var c = el("div", "bama__cell");
        c.appendChild(el("div", "bama__label", label));
        c.appendChild(el("div", "bama__val", value));
        return c;
      }
      if (o.details) odds.appendChild(cell("Spread", o.details));
      var ap = impliedPct(o.awayML), hp = impliedPct(o.homeML);
      if (ap || hp) {
        odds.appendChild(cell((g.away.abbr || "Away") + " win", ap || "—"));
        odds.appendChild(cell((g.home.abbr || "Home") + " win", hp || "—"));
      }
      if (o.overUnder !== null && o.overUnder !== undefined) {
        odds.appendChild(cell("Total", String(o.overUnder)));
      }
      if (odds.childNodes.length) wrap.appendChild(odds);
    } else {
      wrap.appendChild(el("div", "bama__meta", "No line posted yet"));
    }

    body.appendChild(wrap);
    return body;
  }

  function emptySlide(sub) {
    var body = el("div", "slide__body");
    var box = el("div", "empty");
    box.appendChild(el("div", "empty__big", "No fixtures today"));
    box.appendChild(el("div", "empty__sub", sub));
    body.appendChild(box);
    return body;
  }

  /* ---------- deck assembly ---------- */

  function sigOf(kind, games) {
    var parts = games.map(function (g) {
      return g.id + ":" + g.state + ":" + g.away.score + "-" + g.home.score +
             ":" + (g.clock || "") + ":" + (g.odds ? g.odds.details + "/" + g.odds.overUnder : "");
    });
    return kind + "|" + parts.join(",");
  }

  function addPages(out, kind, kicker, games, cols, liveFlag) {
    if (!games.length) return;
    var split = chunk(games, PER[kind], MAXPAGES[kind]);
    split.pages.forEach(function (page, i) {
      out.push({
        id: kind + "-" + i,
        kind: kind,
        kicker: kicker,
        live: !!liveFlag,
        sub: subFor(kind, games.length, split.dropped),
        page: i + 1,
        pages: split.pages.length,
        count: page.length,
        sig: sigOf(kind, page),
        hold: holdFor(kind, page.length),
        build: function () {
          if (kind === "odds") return oddsSlide(page);
          if (kind === "week") return weekSlide(page);
          // today's slate reads best split by kickoff time
          return gridSlide(page, cols, kind === "today");
        }
      });
    });
  }

  // Today's slate filed by competition, so each sport gets its own page
  // (or pages) instead of everything being lumped into "today" and "final".
  // Busiest competition leads; inside a competition, still-to-play sits
  // above finished.
  function addTodayByLeague(out, pre, post) {
    var all = pre.concat(post);
    if (!all.length) return;

    var order = [];
    var byLg = {};
    all.forEach(function (g) {
      var k = g.league || "OTHER";
      if (!byLg[k]) { byLg[k] = []; order.push(k); }
      byLg[k].push(g);
    });
    order.sort(function (a, b) { return byLg[b].length - byLg[a].length; });

    order.forEach(function (lg, li) {
      var games = byLg[lg];
      games.sort(function (a, b) {
        if (a.state !== b.state) return a.state === "pre" ? -1 : 1;
        return (a.start || 0) - (b.start || 0);
      });

      var nPre = games.filter(function (x) { return x.state === "pre"; }).length;
      var nPost = games.length - nPre;
      var bits = [];
      if (nPre)  bits.push(nPre + " to come");
      if (nPost) bits.push(nPost + " final");

      var split = chunk(games, PER.today, MAXPAGES.today);
      split.pages.forEach(function (page, i) {
        out.push({
          id: "lg-" + li + "-" + i,
          kind: "today",
          kicker: lg,
          live: false,
          sub: bits.join(" · ") +
               (split.dropped > 0 ? " · +" + split.dropped + " not shown" : ""),
          page: i + 1,
          pages: split.pages.length,
          count: page.length,
          sig: sigOf("lg-" + lg, page),
          hold: holdFor("today", page.length),
          build: function () { return gridSlide(page, 2, false); }
        });
      });
    });
  }

  // One slide per calendar day, rather than fixed-size chunks that split a
  // day across slides. A day with more fixtures than a slide holds still
  // pages, but the pages never mix two days together.
  function addWeekByDay(out, later) {
    if (!later.length) return;

    var order = [];
    var byDay = {};
    later.forEach(function (g) {
      var k = g.day || "";
      if (!byDay[k]) { byDay[k] = []; order.push(k); }
      byDay[k].push(g);
    });

    order.forEach(function (dayKey, dayIdx) {
      var games = byDay[dayKey];
      var split = chunk(games, PER.week, MAXPAGES.week);
      split.pages.forEach(function (page, i) {
        var label = longDay(page[0].start);
        out.push({
          id: "week-" + dayIdx + "-" + i,
          kind: "week",
          kicker: label,
          live: false,
          sub: games.length + (games.length === 1 ? " fixture" : " fixtures") +
               (split.dropped > 0 ? " · +" + split.dropped + " not shown" : ""),
          page: i + 1,
          pages: split.pages.length,
          count: page.length,
          sig: sigOf("week-" + dayKey, page),
          hold: holdFor("week", page.length),
          build: function () { return weekSlide(page, true); }
        });
      });
    });
  }

  function subFor(kind, total, dropped) {
    var base = {
      live:  total + " in progress",
      today: total + " to come today",
      final: total + " completed today",
      odds:  "DraftKings · " + total + " with a line",
      week:  total + " fixtures ahead"
    }[kind] || "";
    return dropped > 0 ? base + " · +" + dropped + " not shown" : base;
  }

  function buildDeck(data) {
    var out = [];
    var games = data.games || [];

    var today = games.filter(function (g) { return g.today; });
    var later = games.filter(function (g) { return !g.today && g.state === "pre"; });

    var live = today.filter(function (g) { return g.state === "in"; });
    var pre  = today.filter(function (g) { return g.state === "pre"; });
    var post = today.filter(function (g) { return g.state === "post"; });

    live.sort(function (a, b) { return (a.start || 0) - (b.start || 0); });
    pre.sort(function (a, b)  { return (a.start || 0) - (b.start || 0); });
    post.sort(function (a, b) { return (b.start || 0) - (a.start || 0); });
    later.sort(function (a, b) { return (a.start || 0) - (b.start || 0); });

    // Alabama gets a permanent slide up front - live, next up, or the last
    // result during an off-week, so there's always something there.
    var bama = findBama(data);
    if (bama) {
      out.push({
        id: "bama", kind: "bama",
        kicker: bama.state === "in" ? "Alabama · live" :
                bama.state === "post" ? "Alabama · final" : "Next Alabama football",
        live: bama.state === "in",
        sub: bama.league || "",
        page: 1, pages: 1, count: 1,
        sig: sigOf("bama", [bama]),
        hold: bama.state === "in" ? 16000 : 13000,
        build: function () { return bamaSlide(bama); }
      });
    }

    // Live cuts across every sport and is the time-critical stuff, so it
    // leads as one block. Everything else today is filed by competition.
    addPages(out, "live",  "Live now",      live, 2, true);
    addTodayByLeague(out, pre, post);

    // Odds: everything still to play that actually carries a line,
    // today first, then the rest of the week.
    var priced = pre.concat(later).filter(function (g) { return !!g.odds; });
    addPages(out, "odds", "Betting lines", priced, 0, false);

    addWeekByDay(out, later);

    if (!out.length) {
      out.push({
        id: "empty-0", kind: "empty", kicker: "Standby", live: false,
        sub: "Nothing on the slate", page: 1, pages: 1,
        sig: "empty|" + (data.warming ? "warm" : "cold"),
        hold: HOLD.empty,
        build: function () {
          return emptySlide(data.warming
            ? "Filling the delay buffer — the board unlocks shortly."
            : "No fixtures found in the next week for any team on your list.");
        }
      });
    }
    return out;
  }

  /* ---------- presentation ---------- */

  var stage = document.getElementById("stage");
  var dotsBox = document.getElementById("dots");
  var railMeta = document.getElementById("railMeta");
  var bar = document.getElementById("bar");
  var rail = document.getElementById("rail");

  function paintDots() {
    dotsBox.innerHTML = "";
    for (var i = 0; i < deck.length; i++) {
      var d = el("span", "dot");
      if (deck[i].live) d.classList.add("is-live");
      if (i === index) d.classList.add("is-on");
      dotsBox.appendChild(d);
    }
    var s = deck[index];
    railMeta.textContent = s
      ? (index + 1) + " / " + deck.length + "   ·   " +
        (paused ? "Paused" : auto ? "Auto" : "Manual") +
        "   ·   space pause   ←→ move   f full   r refresh"
      : "";
  }

  function showSlide(soft) {
    var s = deck[index];
    if (!s) return;
    if (soft && s.id === renderedId && s.sig === renderedSig) {
      paintDots();
      return;                       // nothing changed; don't restart the hold
    }

    var node = el("section", "slide");
    // Lets the CSS size cards to how many are actually on screen: a slide
    // showing one fixture gets to be much larger than one showing four.
    node.setAttribute("data-count", String(s.count || 1));
    node.setAttribute("data-kind", s.kind);
    var head = el("div", "slide__head");
    var kicker = el("h1", "slide__kicker" + (s.live ? " is-live" : ""), s.kicker);
    head.appendChild(kicker);
    head.appendChild(el("span", "slide__sub", s.sub));
    if (s.pages > 1) {
      head.appendChild(el("span", "slide__page", s.page + " of " + s.pages));
    }
    node.appendChild(head);
    node.appendChild(s.build());

    stage.innerHTML = "";
    stage.appendChild(node);

    renderedId = s.id;
    renderedSig = s.sig;
    if (!soft) elapsed = 0;
    paintDots();
  }

  function go(step) {
    if (!deck.length) return;
    index = (index + step + deck.length) % deck.length;
    elapsed = 0;
    showSlide(false);
  }

  function applyDeck(next) {
    var currentId = deck[index] ? deck[index].id : null;
    deck = next;
    var found = -1;
    for (var i = 0; i < deck.length; i++) {
      if (deck[i].id === currentId) { found = i; break; }
    }
    if (found >= 0) index = found;
    else if (index >= deck.length) index = 0;
    showSlide(true);
  }

  function tick() {
    var s = deck[index];
    if (!s) return;
    if (!paused && auto && deck.length > 1) {
      elapsed += TICK_MS;
      if (elapsed >= s.hold) { go(1); return; }
    }
    var frac = (!auto || paused) ? 0 : Math.min(1, elapsed / s.hold);
    bar.style.transform = "scaleX(" + frac + ")";
    rail.className = paused || !auto ? "rail is-paused" : "rail";
  }

  /* ---------- data ---------- */

  function render(data) {
    lastData = data;

    var warm = document.getElementById("warming");
    warm.className = data.warming ? "warming is-on" : "warming";
    if (data.warming) {
      document.getElementById("warmingText").textContent =
        "Filling the delay buffer — scores and lines unlock in " +
        mmss(data.warmingRemaining) + ".";
      document.getElementById("offset").textContent = "—:—";
    } else if (data.snapshotTime) {
      document.getElementById("offset").textContent =
        "−" + mmss(data.serverTime - data.snapshotTime);
    }

    var signal = document.getElementById("signal");
    if (data.errorCount > 0) {
      signal.textContent = data.errorCount + " feed" + (data.errorCount > 1 ? "s" : "") + " down";
      signal.className = "rack__signal is-warn";
    } else {
      signal.textContent = "Signal ok";
      signal.className = "rack__signal";
    }

    applyDeck(buildDeck(data));
  }

  function offline() {
    var signal = document.getElementById("signal");
    signal.textContent = "No link to server";
    signal.className = "rack__signal is-warn";
    // last good deck stays on screen — never blank out
  }

  function pull() {
    var xhr = new XMLHttpRequest();
    xhr.open("GET", "/api/board?t=" + Date.now(), true);
    xhr.timeout = 12000;
    xhr.onload = function () {
      if (xhr.status !== 200) return offline();
      try { render(JSON.parse(xhr.responseText)); } catch (e) { offline(); }
    };
    xhr.onerror = offline;
    xhr.ontimeout = offline;
    xhr.send();
  }

  function tickClock() {
    var now = new Date();
    document.getElementById("clock").textContent =
      now.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
    document.getElementById("today").textContent =
      now.toLocaleDateString([], { weekday: "long", month: "short", day: "numeric" });
  }

  /* ---------- controls ---------- */

  document.addEventListener("keydown", function (e) {
    if (e.key === "f") {
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen();
    }
    if (e.key === "r") pull();
    if (e.key === "c") document.body.classList.toggle("kiosk");
    if (e.key === "s") { auto = !auto; elapsed = 0; paintDots(); }
    if (e.key === " ") { e.preventDefault(); paused = !paused; paintDots(); }
    if (e.key === "ArrowRight") { paused = false; go(1); }
    if (e.key === "ArrowLeft")  { paused = false; go(-1); }
  });

  // A touch or click anywhere holds the current slide for a beat.
  stage.addEventListener("click", function () { paused = !paused; paintDots(); });

  tickClock();
  setInterval(tickClock, 1000);
  setInterval(tick, TICK_MS);
  pull();
  setInterval(pull, REFRESH_MS);
})();
</script>
</body>
</html>
